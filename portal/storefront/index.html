<html lang="en"><head><meta charset="utf-8">

<title>Gifting Needs — Product Catalogue</title>
<style>
:root{--navy:#0B2050;--red:#D42027;--gold:#C9962B;--ink:#1b2333;--mut:#6b7385;
--line:#e6e9f0;--bg:#f6f7fa;--card:#fff;--r:12px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{background:var(--navy);color:#fff;padding:18px 22px;display:flex;
align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
header h1{font-size:18px;margin:0;letter-spacing:.02em;font-weight:600}
header .tag{font-size:12px;color:#aab4cc}
#q{margin-left:auto;flex:1;min-width:220px;max-width:420px;padding:10px 14px;
border:0;border-radius:999px;font-size:14px}
.wrap{display:flex;gap:22px;padding:22px;align-items:flex-start}
aside{width:250px;flex:none;background:var(--card);border:1px solid var(--line);
border-radius:var(--r);padding:18px;position:sticky;top:78px}
aside h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;
color:var(--mut);margin:0 0 10px}
.band{display:block;width:100%;text-align:left;padding:9px 12px;margin-bottom:6px;
background:#fff;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:14px}
.band:hover{border-color:var(--navy)}
.band.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.band span{float:right;opacity:.6;font-size:12px}
.rng{margin:14px 0 4px}
.rng input{width:100%}
.vals{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:#fff}
main{flex:1;min-width:0}
.bar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.count{color:var(--mut);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
overflow:hidden;display:flex;flex-direction:column;transition:.15s}
.card:hover{box-shadow:0 6px 20px rgba(11,32,80,.10);transform:translateY(-2px)}
.ph{position:relative;width:100%;min-height:0;flex-shrink:0;overflow:hidden;aspect-ratio:1;background:#fff;display:flex;align-items:center;justify-content:center;
border-bottom:1px solid var(--line)}
.ph img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:contain}
.ph .no{color:#c8cede;font-size:12px}
.info{padding:11px 12px 13px;display:flex;flex-direction:column;gap:5px;flex:1}
.nm{font-size:13.5px;font-weight:600;line-height:1.35;
display:block;overflow-wrap:anywhere}
.vd{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.pr{margin-top:auto;display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.pr b{font-size:17px;color:var(--navy)}
.pr s{color:var(--mut);font-size:12.5px}
.off{color:#0a7d3c;font-size:11.5px;font-weight:600}
.src{font-size:10px;color:#aab1c2;margin-top:2px}
.more{display:block;margin:26px auto;padding:11px 26px;border:1px solid var(--navy);
background:#fff;color:var(--navy);border-radius:999px;cursor:pointer;font-size:14px}
.empty{padding:60px;text-align:center;color:var(--mut)}
@media(max-width:820px){.wrap{flex-direction:column}aside{width:100%;position:static}}
</style></head><body>

</aside>
<main>

</main></div>

  return '<div class="card"><div class="ph">'+
    (d.i?'<img loading="lazy" src="images/'+d.i+'" alt="">':'<span class="no">No image</span>')+
    '</div><div class="info"><div class="vd">'+esc(d.v)+'</div>'+
    '<div class="nm">'+esc(d.n)+'</div><div class="pr"><b>₹'+d.p.toLocaleString('en-IN')+'</b>'+
    (d.m?'<s>₹'+d.m.toLocaleString('en-IN')+'</s>':'')+
    (off>0?'<span class="off">'+off+'% off</span>':'')+'</div>'+
    (d.c?'<div class="src">'+esc(d.c)+'</div>':'')+'</div></div>';}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function paint(){
  const r=filtered();
  $('count').textContent=r.length.toLocaleString('en-IN')+' products';
  $('grid').innerHTML=r.slice(0,shown).map(card).join('');
  $('more').style.display=r.length>shown?'block':'none';
  $('empty').style.display=r.length?'none':'block';
  $('rlab').textContent='up to ₹'+(+$('rmax').value).toLocaleString('en-IN');
  [...bandsEl.children].forEach((el,i)=>el.classList.toggle('on',band===i));}
$('more').onclick=()=>{shown+=60;paint()};
['q','vend','sort','rmax'].forEach(id=>$(id).addEventListener('input',()=>{shown=60;paint()}));
paint();
</script></body></html>
