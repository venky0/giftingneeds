<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Portal | Gifting Needs</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="../../assets/favicon.png">
  <link rel="stylesheet" href="../../assets/style.css">
  <link rel="stylesheet" href="../../assets/portal.css">
  <style>
    body { background: var(--bg-primary); }
    .portal-shell { max-width: 860px; margin: 0 auto; padding: 3rem 1.5rem 4rem; }
    .portal-brand { display: flex; align-items: center; gap: 1rem; margin-bottom: 2.5rem; }
    .portal-brand img { height: 52px; width: auto; }
    .portal-brand span {
      font-size: .72rem; font-weight: 800; letter-spacing: .16em;
      text-transform: uppercase; color: var(--text-subtle);
      padding-left: 1rem; border-left: 1px solid var(--border);
    }
    .portal-back { display: inline-block; margin-bottom: 1.25rem; font-weight: 700; color: var(--text-gold); }
    .portal-foot {
      margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--border);
      font-size: .88rem; color: var(--text-subtle);
    }
    .portal-foot a { color: var(--text-gold); font-weight: 700; }
  </style>
</head>
<body>
  <div class="portal-shell">
    <div class="portal-brand">
      <img src="../../assets/logo.png" alt="Gifting Needs">
      <span>Client portal</span>
    </div>

    <a class="portal-back" href="../../">&larr; All accounts</a>

    <h1 class="serif-font" id="portal-customer-name"
        style="font-size:clamp(1.7rem,4vw,2.4rem); margin:0 0 .6rem;">Your files</h1>
    <p style="color:var(--text-muted); max-width:60ch; margin:0 0 1.75rem;">
      Documents shared with your account. If something is missing, contact your
      account manager on <a href="tel:+916361054099" style="color:var(--text-gold); font-weight:700;">+91 63610 54099</a>.
    </p>

    <div class="portal-status" id="portal-status" role="status"></div>

    <div id="portal-root" data-customer="demo-customer"></div>

    <p class="portal-foot">
      Gifting Needs · Bengaluru · <a href="tel:+916361054099">+91 63610 54099</a>
    </p>
  </div>

  <script src="../../assets/clients.js"></script>
</body>
</html>
